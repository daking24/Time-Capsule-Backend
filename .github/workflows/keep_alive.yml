name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Run every 14 minutes to beat the 15-min timeout
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: curl -I https://time-capsule-backend-65l6.onrender.com
        continue-on-error: true
